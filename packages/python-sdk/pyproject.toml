[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicad"
version = "0.1.0"
description = "Official grounded Python generative SDK for AI-Native CAD graphs and .aicad projects"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AI-Native CAD Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "jsonschema>=4.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aicad = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
