[package]
name = "ai-native-cad-desktop"
version = "0.1.0"
edition = "2024"
description = "Tauri v2 desktop host shell for AI-Native CAD Studio Workbench"
license = "Apache-2.0"

# Isolate this Tauri desktop crate from the repository root Cargo workspace
# to avoid workspace membership conflicts during `cargo test --workspace`.
[workspace]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
occt-ffi = ["cad-kernel-occt/occt-ffi", "cad-evaluator/occt-ffi", "cad-runtime/occt-ffi"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cad-cadpack = { path = "../../../crates/cad-cadpack" }
cad-container = { path = "../../../crates/cad-container" }
cad-evaluator = { path = "../../../crates/cad-evaluator" }
cad-hir = { path = "../../../crates/cad-hir" }
cad-ir = { path = "../../../crates/cad-ir" }
cad-kcl-bridge = { path = "../../../crates/cad-kcl-bridge" }
cad-kernel-occt = { path = "../../../crates/cad-kernel-occt" }
cad-mcp = { path = "../../../crates/cad-mcp" }
cad-render = { path = "../../../crates/cad-render" }
cad-runtime = { path = "../../../crates/cad-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
cad-observe = { path = "../../../crates/cad-observe", features = ["sink"] }

[dev-dependencies]
serde_json = "1"
