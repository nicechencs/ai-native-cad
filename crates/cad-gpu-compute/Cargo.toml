[package]
name = "cad-gpu-compute"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
wgpu-compute = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dependencies]
cad-observe.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu = { version = "24.0.3", optional = true }
bytemuck = { version = "1.21.0", features = ["derive"], optional = true }
pollster = { version = "0.4.0", optional = true }

[dev-dependencies]
cad-observe = { workspace = true, features = ["sink"] }
tracing-subscriber.workspace = true
