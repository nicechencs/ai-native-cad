# Cargo-nextest configuration for parallel Rust test execution.
#
# Run locally with:
#   cargo nextest run --workspace --locked
#   cargo nextest run --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

[store]
dir = "target/nextest"

[test-groups.latency-sensitive]
max-threads = 1

[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }
retries = 0

[[profile.default.overrides]]
filter = "test(v04_live_selection_round_trip_p95_under_30ms) | test(ten_thousand_instance_cadpack_scale_regression)"
test-group = "latency-sensitive"
threads-required = "num-cpus"

[profile.ci]
fail-fast = false
slow-timeout = { period = "45s", terminate-after = 4 }
retries = { backoff = "fixed", count = 1, delay = "1s" }

[[profile.ci.overrides]]
filter = "test(v04_live_selection_round_trip_p95_under_30ms) | test(ten_thousand_instance_cadpack_scale_regression)"
test-group = "latency-sensitive"
threads-required = "num-cpus"
